kind = "web"
previewPath = "/"
title = "Auto Glass Search OS"
description = "A specialized search growth and AI systems website for established auto glass operators, offering managed execution or systems built with internal teams."
version = "1.0.0"
id = "artifacts/auto-glass-search-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18694

[services.development]
run = "pnpm run dev"

[services.production]
build = [ "pnpm", "run", "build" ]
run = "node artifacts/auto-glass-search-os/server.mjs"

[services.env]
PORT = "18694"
BASE_PATH = "/"