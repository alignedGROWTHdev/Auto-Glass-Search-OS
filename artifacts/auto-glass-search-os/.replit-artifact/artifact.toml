kind = "web"
previewPath = "/"
title = "Auto Glass Search OS"
description = "A search-growth and customer-acquisition website for established auto glass businesses, covering organic search, local maps, AI visibility, paid search, and qualified lead capture."
version = "1.0.0"
id = "artifacts/auto-glass-search-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18694

[services.development]
run = "pnpm --filter @workspace/auto-glass-search-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auto-glass-search-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/auto-glass-search-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18694"
BASE_PATH = "/"
