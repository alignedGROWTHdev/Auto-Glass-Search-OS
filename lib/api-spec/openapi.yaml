openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Prospect lead delivery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a growth analysis request
      description: Creates or updates a HubSpot contact for a validated growth analysis request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSubmissionInput"
      responses:
        "200":
          description: Lead delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSubmissionResult"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: HubSpot delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadSubmissionInput:
      type: object
      additionalProperties: false
      required:
        - name
        - company
        - phone
        - email
        - website
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        company:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          minLength: 7
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          minLength: 3
          maxLength: 300
        fleetScale:
          type: string
          maxLength: 100
        primaryMarkets:
          type: string
          maxLength: 300
        monthlyInvestment:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 200
        medium:
          type: string
          maxLength: 200
        campaign:
          type: string
          maxLength: 200
        term:
          type: string
          maxLength: 200
        gclid:
          type: string
          maxLength: 300
        landingPage:
          type: string
          maxLength: 500
        honey:
          type: string
          maxLength: 500
    LeadSubmissionResult:
      type: object
      additionalProperties: false
      required:
        - success
      properties:
        success:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string

